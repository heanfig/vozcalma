name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Sync Wompi env vars to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: WOMPI_PUBLIC_KEY,WOMPI_PRIVATE_KEY,WOMPI_EVENTS_SECRET,WOMPI_INTEGRITY_SECRET,WOMPI_ENVIRONMENT
          script: |
            cd /opt/vozcalma

            # Remove stale Wompi block (idempotent) and append current secrets
            sed -i '/^# --- WOMPI-MANAGED-START ---$/,/^# --- WOMPI-MANAGED-END ---$/d' .env 2>/dev/null || true
            cat >> .env <<EOF
            # --- WOMPI-MANAGED-START --- (synced by CI, do not edit manually)
            WOMPI_PUBLIC_KEY=${WOMPI_PUBLIC_KEY}
            WOMPI_PRIVATE_KEY=${WOMPI_PRIVATE_KEY}
            WOMPI_EVENTS_SECRET=${WOMPI_EVENTS_SECRET}
            WOMPI_INTEGRITY_SECRET=${WOMPI_INTEGRITY_SECRET}
            WOMPI_ENVIRONMENT=${WOMPI_ENVIRONMENT:-test}
            # --- WOMPI-MANAGED-END ---
            EOF
            chmod 600 .env
        env:
          WOMPI_PUBLIC_KEY: ${{ secrets.WOMPI_PUBLIC_KEY }}
          WOMPI_PRIVATE_KEY: ${{ secrets.WOMPI_PRIVATE_KEY }}
          WOMPI_EVENTS_SECRET: ${{ secrets.WOMPI_EVENTS_SECRET }}
          WOMPI_INTEGRITY_SECRET: ${{ secrets.WOMPI_INTEGRITY_SECRET }}
          WOMPI_ENVIRONMENT: ${{ secrets.WOMPI_ENVIRONMENT }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/vozcalma

            # Pull latest image
            docker pull ghcr.io/${{ github.repository }}:latest

            # Update compose files
            docker compose pull
            docker compose up -d --remove-orphans

            # Clean old images
            docker image prune -f
