name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Regenera el .env completo del VPS desde GitHub Secrets.
      # Single source of truth: rotar un secreto = gh secret set + re-run.
      - name: Sync full .env to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: PUBLIC_CLERK_PUBLISHABLE_KEY,CLERK_SECRET_KEY,PUBLIC_CLERK_SIGN_IN_URL,PUBLIC_CLERK_SIGN_UP_URL,SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_SECRET_KEY,OPENROUTER_API_KEY,ELEVENLABS_API_KEY,ELEVENLABS_VOICE_ID,ELEVENLABS_USD_PER_1K_CHARS,ADMIN_API_SECRET,ADMIN_PASSWORD,CSRF_SECRET,COOKIE_SECRET,RESEND_API_KEY,EMAIL_FROM,PUBLIC_SITE_URL,WOMPI_PUBLIC_KEY,WOMPI_PRIVATE_KEY,WOMPI_EVENTS_SECRET,WOMPI_INTEGRITY_SECRET,WOMPI_ENVIRONMENT
          script: |
            cd /opt/vozcalma
            TMP=$(mktemp)
            umask 077
            {
              echo "# Managed by CI (.github/workflows/deploy.yml) — do not edit by hand."
              echo "# Variables: gh variable set <KEY> --body '<value>' --repo heanfig/vozcalma"
              echo "# Secrets:   gh secret   set <KEY> --body '<value>' --repo heanfig/vozcalma"
              echo ""
              echo "# Clerk"
              echo "PUBLIC_CLERK_PUBLISHABLE_KEY=${PUBLIC_CLERK_PUBLISHABLE_KEY}"
              echo "CLERK_SECRET_KEY=${CLERK_SECRET_KEY}"
              echo "PUBLIC_CLERK_SIGN_IN_URL=${PUBLIC_CLERK_SIGN_IN_URL}"
              echo "PUBLIC_CLERK_SIGN_UP_URL=${PUBLIC_CLERK_SIGN_UP_URL}"
              echo ""
              echo "# Supabase"
              echo "SUPABASE_URL=${SUPABASE_URL}"
              echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
              echo "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}"
              echo "SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}"
              echo ""
              echo "# LLM / TTS"
              echo "OPENROUTER_API_KEY=${OPENROUTER_API_KEY}"
              echo "ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}"
              echo "ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}"
              echo "ELEVENLABS_USD_PER_1K_CHARS=${ELEVENLABS_USD_PER_1K_CHARS:-0.22}"
              echo ""
              echo "# Seguridad"
              echo "ADMIN_API_SECRET=${ADMIN_API_SECRET}"
              echo "ADMIN_PASSWORD=${ADMIN_PASSWORD}"
              echo "CSRF_SECRET=${CSRF_SECRET}"
              echo "COOKIE_SECRET=${COOKIE_SECRET}"
              echo ""
              echo "# Email"
              echo "RESEND_API_KEY=${RESEND_API_KEY}"
              echo "EMAIL_FROM=${EMAIL_FROM}"
              echo ""
              echo "# App"
              echo "PUBLIC_SITE_URL=${PUBLIC_SITE_URL}"
              echo ""
              echo "# Wompi"
              echo "WOMPI_PUBLIC_KEY=${WOMPI_PUBLIC_KEY}"
              echo "WOMPI_PRIVATE_KEY=${WOMPI_PRIVATE_KEY}"
              echo "WOMPI_EVENTS_SECRET=${WOMPI_EVENTS_SECRET}"
              echo "WOMPI_INTEGRITY_SECRET=${WOMPI_INTEGRITY_SECRET}"
              echo "WOMPI_ENVIRONMENT=${WOMPI_ENVIRONMENT:-test}"
            } > "$TMP"
            chmod 600 "$TMP"
            mv "$TMP" .env
        env:
          # vars.*: config pública / no sensible (editable en Settings → Variables)
          PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.PUBLIC_CLERK_PUBLISHABLE_KEY }}
          PUBLIC_CLERK_SIGN_IN_URL: ${{ vars.PUBLIC_CLERK_SIGN_IN_URL }}
          PUBLIC_CLERK_SIGN_UP_URL: ${{ vars.PUBLIC_CLERK_SIGN_UP_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_USD_PER_1K_CHARS: ${{ vars.ELEVENLABS_USD_PER_1K_CHARS }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          WOMPI_PUBLIC_KEY: ${{ vars.WOMPI_PUBLIC_KEY }}
          WOMPI_ENVIRONMENT: ${{ vars.WOMPI_ENVIRONMENT }}
          # secrets.*: crypto / API keys sensibles
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ADMIN_API_SECRET: ${{ secrets.ADMIN_API_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CSRF_SECRET: ${{ secrets.CSRF_SECRET }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WOMPI_PRIVATE_KEY: ${{ secrets.WOMPI_PRIVATE_KEY }}
          WOMPI_EVENTS_SECRET: ${{ secrets.WOMPI_EVENTS_SECRET }}
          WOMPI_INTEGRITY_SECRET: ${{ secrets.WOMPI_INTEGRITY_SECRET }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/vozcalma

            # Pull latest image
            docker pull ghcr.io/${{ github.repository }}:latest

            # Update compose files
            docker compose pull
            docker compose up -d --remove-orphans

            # Clean old images
            docker image prune -f
